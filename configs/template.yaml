# 干净模板：从这份开始配，不要直接改 example.yaml。
#
# 用法：
#   1. 复制成你自己的名字，比如 my-4号.yaml
#   2. weights 里写上你想要的副词条和单价（没写的 = 废词条）
#   3. stage_require 六档门槛全部手填，3 词 / 4 词各一套
#   4. 打开窗口，在卡片页取消勾选不要的组合，保存后 accepted 会自动写回来
#
# 门槛怎么定：分数 = 命中的词条单价 × 该词条被强化的次数之和。
# 3 词在 +3 只是出第 4 条、还没有 +1，所以同级门槛通常比 4 词低。

name: 未命名
min_useful_types: 0
ocr_retry: 3

# 本次最多处理几个盘（含跳过的）。到数就停，方便试跑。
run:
  max_discs: 20

filters:
  require_s_rank: true
  skip_locked: true
  skip_equipped: true
  skip_discarded: true

# 游戏仓库里先筛好，工具只管副词条。空列表 = 不加条件。
game_filter:
  sets: []          # 例：["折枝剑歌"]
  slots: []         # 例：[4]
  mainstats: []     # 例：["暴击伤害"]，只有 4/5/6 号位能选

# 词条单价，所有阶段共用。
weights:
  暴击率: 1.0
  暴击伤害: 1.2
  攻击力%: 0.8

# 每一档的分数门槛。必须六档写全，3 词一套、4 词一套。
stage_require:
  three:
    0: 2.0
    3: 2.5
    6: 4.0
    9: 5.0
    12: 6.0
    15: 7.0
  four:
    0: 3.0
    3: 5.0
    6: 6.0
    9: 7.0
    12: 8.0
    15: 9.0

# 第二勾选白名单，窗口里勾完自动写回来，不用手填。
accepted: []

# 任务链：按部位排多个任务，每个部位一套权重。窗口里配，不用手填。
task_chain: []
