[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zzz-ddtool"
version = "1.0.0"
description = "绝区零驱动盘自动强化辅助：本地截屏 + OCR + 模拟点击"
requires-python = ">=3.11"
# 缺一个都跑不起来：PySide6 管窗口和图像，opencv/numpy 是 OCR 前置，
# rapidocr 是本地 OCR（不联网、不装 Paddle 全家桶）。
# 注意包名是 rapidocr，不是 rapidocr-onnxruntime（那是旧版，API 对不上，
# 装了会报 ModuleNotFoundError: No module named 'rapidocr'）。
dependencies = [
  "pyyaml>=6.0",
  "PySide6-Essentials>=6.6",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "rapidocr>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zzz-ddtool = "zzz_ddtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zzz_ddtool = [
  "assets/templates/**/*.png",
  "assets/discocr/profiles.json",
  "assets/discocr/templates.json",
  "assets/discocr/templates/*.png",
  "assets/picker/templates.json",
  "assets/picker/templates/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 默认排除真实窗口用例和停用功能用例；改动相关功能时显式选择
# window / legacy。测试范围和验证限制见 docs/测试约定.md。
addopts = '-m "not window and not legacy"'
markers = [
  "window: 会创建真实桌面窗口的用例，默认跳过以避免占用屏幕",
  "legacy: 仅验证已停用功能的保留实现，默认不运行，修改该函数时显式选择",
]
