[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zzz-ddtool"
version = "0.1.0"
description = "ZZZ drive disc upgrade helper: local OCR + click (decision engine first)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zzz-ddtool = "zzz_ddtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zzz_ddtool = ["assets/templates/**/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
